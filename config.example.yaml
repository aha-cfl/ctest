mode: paper                 # paper | live  (live also needs ROUNDUP_BOT_LIVE=I_ACCEPT_TOTAL_LOSS)
exchange: bybit             # any ccxt exchange with USDT perps
symbol: BTC/USDT:USDT
timeframe: 1h

roundup:
  multiplier: 1.0
  whole_dollar_adds_one: false
  min_sweep_usd: 25
  ledger_path: data/roundup_ledger.json

strategy:                   # "follow the trend": EMA crossover
  fast_ema: 20
  slow_ema: 50
  allow_short: true

ladder:                     # all values are ROE % (return on margin), NOT price %
  levels_pct: [50, 100, 150, 200]
  close_fractions: [0.25, 0.25, 0.25, 0.0]   # of original size; 25% runner remains
  step_after_pct: 50        # 250, 300, 350... ratchet the stop on the runner
  stop_loss_roe_pct: -40    # mandatory
  ratchet_stop: true        # hit 50 -> stop to breakeven; hit N -> stop to previous level

risk:
  leverage: 5
  max_leverage: 10
  risk_per_trade_pct: 1.0   # a full stop-out loses 1% of equity (fees included)
  max_risk_per_trade_pct: 2.0
  margin_fraction_per_trade: 0.25   # cap on margin posted per trade
  maintenance_margin_rate: 0.005
  liq_buffer_roe_pct: 20
  max_drawdown_pct: 50      # kill switch, deposit-adjusted
  taker_fee_rate: 0.0005
  min_order_notional_usd: 5
